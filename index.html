<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAMSA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      font-family: Tahoma, Arial, sans-serif;
      background: #111;
    }
    .card {
      width: 100%;
      max-width: 380px;
      padding: 32px 24px;
      text-align: center;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,.3);
    }
    .logo {
      display: block;
      width: 220px;
      max-width: 100%;
      margin: 0 auto 24px;
    }
    a {
      display: block;
      margin-top: 12px;
      padding: 14px;
      border: 2px solid #000;
      border-radius: 12px;
      color: #000;
      font-weight: bold;
      text-decoration: none;
      transition: .2s;
    }
    a:hover { background: #000; color: #fff; }

    /* NFC background */
    body {
      background: linear-gradient(135deg, #040a1c 0%, #0a1d4a 45%, #052f3f 100%);
      overflow-x: hidden;
    }
    .card { position: relative; z-index: 1; }
    .nfc-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .nfc-bg svg.pattern { position: absolute; inset: 0; width: 100%; height: 100%; }
    .nfc-bg .orb { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; animation: drift 14s ease-in-out infinite alternate; }
    .nfc-bg .o1 { width: 340px; height: 340px; background: #00d4ff; top: -90px; left: -100px; }
    .nfc-bg .o2 { width: 380px; height: 380px; background: #3a5bff; bottom: -120px; right: -110px; animation-delay: -5s; }
    .nfc-bg .o3 { width: 260px; height: 260px; background: #8a4dff; top: 45%; left: 62%; opacity: .35; animation-delay: -9s; }
    .nfc-bg .ring {
      position: absolute; top: 50%; left: 50%;
      width: 300px; height: 300px; margin: -150px 0 0 -150px;
      border: 2px solid rgba(0,212,255,.5); border-radius: 50%;
      opacity: 0; animation: nfcPulse 4.5s ease-out infinite;
    }
    .nfc-bg .ring:nth-child(6) { animation-delay: 1.5s; }
    .nfc-bg .ring:nth-child(7) { animation-delay: 3s; }
    .nfc-bg .fl { position: absolute; fill: none; stroke: currentColor; animation: floaty 9s ease-in-out infinite; }
    @keyframes nfcPulse { 0% { transform: scale(.6); opacity: .7; } 100% { transform: scale(4); opacity: 0; } }
    @keyframes floaty { 0%,100% { transform: translateY(0) rotate(var(--r,0deg)); } 50% { transform: translateY(-22px) rotate(calc(var(--r,0deg) + 8deg)); } }
    @keyframes drift { from { transform: translate(0,0); } to { transform: translate(40px,30px); } }
  </style>
</head>
